plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.cisnienie.kalendarz'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.cisnienie.kalendarz'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Klucz zapisany w repozytorium, aby każde zbudowane APK miało ten sam podpis
        // (pozwala instalować aktualizacje bez odinstalowywania aplikacji).
        shared {
            storeFile rootProject.file('signing/cisnienie.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
