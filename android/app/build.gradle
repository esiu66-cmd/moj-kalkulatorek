plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.mojbudzet'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.mojbudzet'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            // Interfejs aplikacji (HTML/JS) jest wspólny z wersją przeglądarkową w katalogu /budzet
            assets.srcDirs = ['../../budzet']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
