name: Zbuduj APK (Mój Budżet)

on:
  push:
    paths:
      - 'budzet/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Budowanie APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug || ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MojBudzet.apk

      - name: Plik APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: MojBudzet-apk
          path: MojBudzet.apk

      - name: Wydanie z plikiem APK (do pobrania na telefonie)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: budzet-build-${{ github.run_number }}
          name: Mój Budżet – kompilacja ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: MojBudzet.apk
          body: |
            Pobierz plik **MojBudzet.apk** na telefonie z Androidem i otwórz go, aby zainstalować aplikację
            (przy pierwszej instalacji Android zapyta o zgodę na instalację z tego źródła).
